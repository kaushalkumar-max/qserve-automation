# QServe automation - all stages in one workflow.
#
# Pick a stage from the dropdown when you click "Run workflow":
#   m1_emulator - does an emulator boot?            (needs nothing)
#   m2_install  - does the APK install and launch?  (needs apk_url)
#   m3_appium   - can Appium read the screen?       (needs apk_url)
#   m4_login    - does the login flow work?         (needs apk_url + QR secret)
#
# Work through them in order. Each one builds on the last.

name: QServe

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        required: true
        default: "m1_emulator"
        type: choice
        options:
          - m1_emulator
          - m2_install
          - m3_appium
          - m4_login
      apk_url:
        description: "APK download URL (leave blank for m1_emulator)"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Hardware acceleration. Without this the emulator is unusably slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Python
        if: inputs.stage != 'm1_emulator'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        if: inputs.stage == 'm3_appium' || inputs.stage == 'm4_login'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Appium
        if: inputs.stage == 'm3_appium' || inputs.stage == 'm4_login'
        run: |
          npm install -g appium
          appium driver install uiautomator2
          pip install Appium-Python-Client selenium

      - name: Download APK
        if: inputs.stage != 'm1_emulator'
        run: |
          if [ -z "${{ inputs.apk_url }}" ]; then
            echo "::error::This stage needs an APK URL. Re-run and paste one in."
            exit 1
          fi
          mkdir -p build
          curl -L --fail -o build/app.apk "${{ inputs.apk_url }}"
          ls -lh build/app.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STAGE: ${{ inputs.stage }}
          QSERVE_QR_B64: ${{ secrets.QSERVE_QR_B64 }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/run_on_device.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.stage }}-run-${{ github.run_number }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn
